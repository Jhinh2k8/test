<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="100" fill="url(#grad)" />
  <!-- Inner card/quill motif -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Book/Scroll Base -->
    <path d="M 64 280 C 120 250, 180 250, 256 280 L 256 100 C 180 70, 120 70, 64 100 Z" fill="#ffffff" fill-opacity="0.15" />
    <path d="M 320 280 C 264 250, 204 250, 128 280 L 128 100 C 204 70, 264 70, 320 100 Z" fill="#ffffff" fill-opacity="0.25" />
    <!-- Feather / Pen Quill -->
    <path d="M 280 40 C 260 90, 210 160, 150 220 L 140 240 L 170 230 C 220 180, 280 120, 310 60 C 320 40, 300 20, 280 40 Z" fill="#a855f7" />
    <path d="M 140 240 L 120 270 L 150 250 Z" fill="#fbbf24" />
    <!-- Monogram NC -->
    <text x="192" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle" letter-spacing="4">NOVEL</text>
  </g>
</svg>
